[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/infra-audio",
    "crates/infra-demucs",
    "crates/infra-storage",
    "crates/cli",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/TA2PWD/NoiseApp"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
application = { path = "crates/application" }
infra-audio = { path = "crates/infra-audio" }
infra-demucs = { path = "crates/infra-demucs" }
infra-storage = { path = "crates/infra-storage" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
